  <style>
    @import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Jua&display=swap');
    :root{--wine:#260727;--plum:#53134f;--violet:#7c3e83;--gold:#f7c76a;--paper:#fff0c9;--ink:#3e1f36;--leaf:#a4ca85}*{box-sizing:border-box}body{margin:0;min-width:320px;background:#190418;color:var(--paper);font-family:"Gowun Batang",serif}.app{min-height:100svh;overflow:hidden;position:relative;background:radial-gradient(ellipse at 50% 58%,#a56ab1 0%,#5e225d 36%,#260727 76%)}
    .curtain{position:absolute;z-index:1;top:-15vh;width:34vw;height:66vh;background:linear-gradient(100deg,#24051f,#7d1b69 48%,#2a0527);border-radius:0 0 55% 18%;box-shadow:inset -22px -8px 30px #12001599}.curtain.left{left:-10vw;transform:rotate(-9deg)}.curtain.right{right:-10vw;transform:scaleX(-1) rotate(-9deg)}.curtain:after{content:"";position:absolute;bottom:0;width:100%;border-bottom:9px solid var(--gold);filter:drop-shadow(0 5px #5a193f)}.rope{position:absolute;z-index:2;top:0;width:7px;height:35vh;background:linear-gradient(90deg,#a96b25,#ffe793,#8b481a);box-shadow:0 0 12px #ffd36b}.rope.left{left:8vw}.rope.right{right:8vw}

    .book{position:absolute;bottom:-110px;left:50%;width:min(900px,115vw);height:250px;transform:translateX(-50%);background:linear-gradient(145deg,#f8d997,#f4bc68 45%,#c78242);border:8px solid #80442d;border-radius:50% 50% 18px 18px;box-shadow:0 -8px 0 #fbe5ad inset,0 -25px 50px #180015}.book:before,.book:after{content:"";position:absolute;top:18px;width:50%;height:175px;background:repeating-linear-gradient(170deg,#fff0bf 0 20px,#e7bd77 22px 24px);border-radius:50% 6% 8% 18%}.book:before{left:3%;transform:rotate(5deg)}.book:after{right:3%;transform:scaleX(-1) rotate(5deg)}
    .game-card{width:min(950px,100%);min-height:560px;display:grid;grid-template-columns:38% 62%;grid-template-rows:auto 1fr;background:#fdf0c8;color:var(--ink);border:7px solid var(--gold);border-radius:24px;box-shadow:0 0 0 5px #6f215d,0 20px 60px #120015aa;overflow:hidden}.game-top{grid-column:1/-1;display:flex;justify-content:space-between;padding:18px 25px;background:#4b174b;color:#fbe5aa;font-weight:700;font-size:13px}.progress{width:180px;height:9px;background:#762d6c;border-radius:99px;overflow:hidden}.progress i{height:100%;display:block;background:var(--gold);width:33%;transition:.35s}.character-zone{position:relative;background:linear-gradient(#6c2f78,#bc7ea8 70%,#e8ba9d);overflow:hidden;display:grid;place-items:end center;padding-bottom:44px}.moon{position:absolute;top:42px;left:50%;width:130px;height:130px;border-radius:50%;background:#ffe4a4;box-shadow:0 0 35px #ffe3a8bb}.hills{position:absolute;bottom:0;width:130%;height:130px;background:#45205b;border-radius:50% 50% 0 0}.character{position:relative;font-size:136px;filter:drop-shadow(0 8px 3px #3b194666);z-index:1}.nameplate{position:absolute;bottom:17px;z-index:2;padding:8px 20px;background:#521a51;color:#ffe4a4;border:2px solid #f4bf69;border-radius:99px;font-size:14px;font-weight:700}.story-zone{padding:34px;display:flex;flex-direction:column;gap:20px;background:linear-gradient(135deg,#fff4d6,#e9c886)}.speech{align-self:flex-start;position:relative;max-width:100%;padding:22px 24px;background:#fffaf0;border:2px solid #d09a5b;border-radius:9px 24px 24px 24px;line-height:1.8;font-size:17px;box-shadow:0 5px 0 #d9ad6d}.speech b{display:block;font-size:12px;color:#8c4b58;margin-bottom:5px}.question{margin-top:auto;font-weight:700;font-size:18px}.choices{display:grid;gap:10px}.choice{background:#fff9e8;border:2px solid #d8aa68;border-radius:13px;padding:13px 15px;text-align:left;color:var(--ink);line-height:1.45;transition:.18s}.choice strong{display:inline-grid;place-items:center;width:23px;height:23px;margin-right:9px;border-radius:50%;background:#6d2b68;color:#ffe8ad;font-size:12px}.feedback{min-height:20px;color:#87524c;font-size:13px;line-height:1.55}.result{text-align:center;width:min(640px,100%);padding:55px 28px;background:linear-gradient(155deg,#fff3cb,#e3b76e);border:7px solid var(--gold);border-radius:28px;color:var(--ink);box-shadow:0 0 0 5px #6f215d,0 20px 60px #120015aa}.result .seal{font-size:60px}.result h2{font-family:Jua,sans-serif;font-size:40px;font-weight:400;margin:16px 0 10px;color:#5e2859}.result p{line-height:1.8}.line{margin:23px 0;padding:18px;background:#fff9e8;border:2px dashed #c79756;border-radius:14px;font-weight:700;line-height:1.65}.restart{padding:13px 25px;border-radius:99px;background:#5c2158;color:#ffe9a9}@keyframes appear{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes glow{to{transform:rotate(45deg) scale(1.9);opacity:.5}}@media(max-width:650px){header{width:min(100% - 28px,1120px)}.chapter{display:none}.title-stage{padding-bottom:135px}.game-card{grid-template-columns:1fr;grid-template-rows:auto 200px auto}.character-zone{grid-row:2;padding-bottom:30px}.moon{width:88px;height:88px;top:20px}.character{font-size:94px}.story-zone{padding:22px}.speech{font-size:15px}.question{margin-top:0}.progress{width:110px}}
    /* 폐 상태는 선택에 따라 어두워지거나 회복됩니다 */
    .lung-box{position:absolute;z-index:4;top:16px;left:14px;display:grid;justify-items:center;gap:2px;padding:8px 10px;background:#fff0cae8;border:2px solid #d49757;border-radius:13px;color:#613052;box-shadow:0 4px 0 #77325955}.lung-box span{font-size:35px;line-height:1;transition:filter .55s,transform .55s}.lung-box small{font-size:10px;font-weight:700}.lung-box.dark-1 span{filter:grayscale(.6) brightness(.7)}.lung-box.dark-2 span{filter:grayscale(1) brightness(.38)}.lung-box.dark-3 span{filter:grayscale(1) brightness(.13)}.lung-box.clean span{filter:none;animation:cleanLung .8s ease}.chat.narrator{align-self:center;max-width:92%;padding:8px 12px;border-radius:99px;background:#e4c982;color:#633758;font-size:12px;text-align:center}.chat.coach{align-self:flex-start;background:#e9f4dc;border:2px solid #b2c99b;border-bottom-left-radius:4px}.chat.coach small{color:#5c8050}@keyframes cleanLung{50%{transform:scale(1.25) rotate(-8deg)}}
    /* 제공한 동화책 무대 이미지를 쓰는 시작 화면 */
    #intro{padding:0 20px 34px}.title-stage{width:min(1280px,100%);min-height:min(74vw,720px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:110px 20px 60px;border:5px solid #b06a3e;border-radius:20px;background-image:linear-gradient(180deg,#24072533 28%,#22052055 100%),url('https://chatgpt.com/api/library/files/libfile_2ae3266f10dc81919627a6ae0af75275/download');background-position:center;background-size:cover;box-shadow:0 0 0 5px #5d194f,0 28px 70px #160014}.title-stage:after{content:"";position:absolute;inset:0;border-radius:16px;background:radial-gradient(ellipse at center,#0000 20%,#16001755 100%);pointer-events:none}.title-stage>*{z-index:1}.title-stage .subtitle{font-weight:700;text-shadow:0 2px 8px #2b0630}.title-stage h1{font-size:clamp(54px,10vw,108px);margin-top:17px}.title-stage p{font-weight:700;text-shadow:0 2px 6px #310633}.title-stage .book{display:none}.title-stage .spark{z-index:2}
    /* 대화가 한 줄씩 쌓이는 스토리 화면 */
    .story-zone{min-height:0}.chat-log{flex:1;min-height:245px;max-height:330px;overflow:auto;display:flex;flex-direction:column;gap:11px;padding-right:4px}.chat{max-width:88%;padding:13px 15px;border-radius:18px;line-height:1.6;font-size:15px;animation:chatIn .28s ease}.chat.friend{align-self:flex-start;background:#fffaf0;border:2px solid #d09a5b;border-bottom-left-radius:4px}.chat.me{align-self:flex-end;background:#63275e;color:#fff4d4;border-bottom-right-radius:4px}.chat small{display:block;margin-bottom:3px;font-weight:700;color:#8a5058}.chat.me small{color:#f7d685}.path-tag{font-size:12px;font-weight:700;color:#8a5058;text-align:center;margin:0}.ending-path{font-family:Jua,sans-serif;font-size:22px;font-weight:400;color:#6b285e;margin:10px 0}.choice:disabled{opacity:.6;cursor:default}@keyframes chatIn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
  </style>

<body><div class="app"><div class="curtain left"></div><div class="curtain right"></div><div class="rope left"></div><div class="rope right"></div><header><div class="logo">✦ 선택의 이야기</div><div class="chapter">NO SMOKING STORY GAME</div></header>
<main class="screen active" id="intro"><section class="title-stage"><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i><div class="subtitle">마음속 용기를 꺼내는 세 장면</div><h1>선택의<br>이야기</h1><p>친구의 권유 앞에서, 나는 어떤 말을 할까?<br>나를 지키는 한마디를 선택해 보세요.</p><button class="start-btn" onclick="startGame()">이야기 펼치기 ✦</button><div class="book"></div></section></main>
<main class="screen" id="game"><section class="game-card"><div class="game-top"><span id="stage">이야기의 시작</span><div class="progress"><i id="bar"></i></div></div><aside class="character-zone"><div class="moon"></div><div class="hills"></div><div class="character" id="character">😏</div><div class="nameplate" id="name">친구</div><div class="lung-box"><span id="lung">🫁✨</span><small id="lungLabel">건강한 폐</small></div></aside><article class="story-zone"><div class="chat-log" id="chatLog" aria-live="polite"></div><p class="path-tag" id="pathTag">선택에 따라 이야기가 달라집니다</p><div class="question" id="question"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback"></div></article></section></main>
<main class="screen" id="ending"><section class="result"><div class="seal">✦</div><h2 id="resultTitle"></h2><p id="resultText"></p><div class="line">“난 안 해. 내 건강은 내가 챙길래.<br>우리 다른 거 하자!”</div><button class="restart" onclick="restart()">처음으로 돌아가기</button></section></main>
</div><script>
const nodes={
  start:{title:'이야기의 시작',name:'친구',face:'😏',text:'쉬는 시간인데, 한 번만 같이 가자. 아무도 몰라.',ask:'나는 어떤 답장을 보낼까?',choices:[['난 안 해. 같이 매점이나 갈래?','quit1'],['그래, 딱 한 번만 해 볼게.','addict1']]},
  quit1:{title:'금연의 길 · 1장',name:'친구',face:'🤨',text:'에이, 한 번도 안 해 봤어? 겁나서 그래?',ask:'놀리는 말에도 내 선택을 지킬까?',choices:[['겁나는 게 아니라 내 몸은 내가 챙길 거야.','quit2'],['오늘은 좀… 다음에 보자.','addict1']]},
  quit2:{title:'금연의 길 · 2장',name:'나',face:'😌',text:'친구가 다시 담배를 건넸지만, 이제는 자리를 옮길 수도 있다는 걸 알아.',ask:'마지막 선택은?',choices:[['난 갈게. 다음에 보자! 하고 다른 친구에게 간다.','quitEnd'],['받기만 하고 피우지는 않을게.','addict2']]},
  addict1:{title:'중독의 길 · 1장',name:'나',face:'😟',text:'한 번쯤은 괜찮을 거라고 생각했지만, 며칠 뒤 또 담배 생각이 난다.',ask:'다시 권유받은 나는?',choices:[['여기서 멈출래. 도움을 받고 끊어 볼게.','quit2'],['이번에도 한 번만 더 할게.','addict2']]},
  addict2:{title:'중독의 길 · 2장',name:'나',face:'😞',text:'처음에는 한 번이었지만, 거절하기가 점점 어려워진다. 담배가 일상에 들어온다.',ask:'이야기는 어느 방향으로 갈까?',choices:[['지금부터 도움을 받아 끊을 거야.','quitEnd'],['괜찮아. 계속 피울래.','addictEnd']]}
};
let current='',path='';const $=id=>document.getElementById(id);function screen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));$(id).classList.add('active')}function addChat(text,type,name){const item=document.createElement('div');item.className='chat '+type;item.innerHTML=(name?`<small>${name}</small>`:'')+text;$('chatLog').append(item);$('chatLog').scrollTop=$('chatLog').scrollHeight}function startGame(){current='start';path='';$('chatLog').innerHTML='';screen('game');setTimeout(draw,250)}function draw(){const n=nodes[current];$('stage').textContent=n.title;$('bar').style.width=(current.includes('quit')?'68':current.includes('addict')?'82':'33')+'%';$('name').textContent=n.name;$('character').textContent=n.face;$('pathTag').textContent=path||'선택에 따라 이야기가 달라집니다';$('question').textContent=n.ask;$('feedback').textContent='';addChat(n.text,'friend',n.name);$('choices').innerHTML=n.choices.map((c,i)=>`<button class="choice" onclick="pick(${i})"><strong>${String.fromCharCode(65+i)}</strong>${c[0]}</button>`).join('')}function pick(i){const n=nodes[current],c=n.choices[i];document.querySelectorAll('.choice').forEach(b=>b.disabled=true);addChat(c[0],'me','나');path=c[1].startsWith('quit')?'금연을 향한 길':'중독으로 향하는 길';$('feedback').textContent='다음 대화가 이어집니다…';setTimeout(()=>{if(c[1]==='quitEnd')finish(true);else if(c[1]==='addictEnd')finish(false);else{current=c[1];draw()}},1100)}function finish(good){$('resultTitle').innerHTML=good?'금연을 선택한 결말':'다시 중독되는 결말';$('resultText').innerHTML=good?'담배 권유를 거절하고 도움을 선택했어요. 혼자 어려우면 친구, 가족, 선생님과 함께 금연을 시작할 수 있어요.':'처음의 작은 선택이 반복되면서 거절하기 어려워졌어요. 하지만 결말은 언제든 바꿀 수 있어요. 지금 도움을 요청하는 것부터 시작해 봐요.';screen('ending')}function restart(){screen('intro')}
</script>
<script>
/* 한 번의 선택이 이어지는 대화형 두 갈래 이야기 */
const storyNodes={
start:{p:1,path:'갈림길 앞',lung:0,face:'😏',name:'친구',m:[['friend','친구','쉬는 시간인데, 한 번만 같이 가자. 아무도 몰라.'],['narrator','','친구의 첫 권유. 지금의 한마디가 다음 장면을 바꿉니다.']],q:'나는 어떻게 답할까?',c:[['난 안 해. 같이 매점이나 갈래?','q1'],['그래, 딱 한 번만 해 볼게.','a1']]},
q1:{p:2,path:'금연을 향한 길',lung:0,face:'🤨',name:'친구',m:[['friend','친구','에이, 한 번도 안 해 봤어? 겁나서 그래?'],['narrator','','놀리는 말이 이어져도 내 선택은 내가 정할 수 있어요.']],q:'계속 권하면?',c:[['겁나는 게 아니라 내 몸은 내가 챙길 거야.','q2'],['오늘은 좀… 다음에 보자.','a2']]},
q2:{p:3,path:'금연을 향한 길',lung:0,face:'🙂',name:'나',m:[['coach','나를 돕는 목소리','짧고 분명한 거절은 나를 지키는 가장 쉬운 방법이에요.'],['narrator','','나는 담배를 피우는 장소에서 벗어나기로 했어요.']],q:'친구에게 무엇을 제안할까?',c:[['우리 농구하러 가자.','q3'],['너희는 가. 난 여기 있을게.','a2']]},
q3:{p:4,path:'금연을 향한 길',lung:0,face:'😌',name:'나',m:[['friend','친구','그래, 운동도 괜찮겠다.'],['narrator','','불편한 자리를 다른 활동으로 바꾸자 마음이 한결 편해졌어요.']],q:'다음 쉬는 시간에도 생각날까?',c:[['생각나도 “난 안 해”라고 다시 말할래.','q4'],['친구가 권하면 그때 생각할래.','a3']]},
q4:{p:5,path:'금연을 향한 길',lung:0,face:'💪',name:'나',m:[['coach','나를 돕는 목소리','금연은 혼자만의 결심이 아니에요. 믿을 사람에게 말해도 좋아요.'],['narrator','','나는 친한 친구에게 내 선택을 이야기했어요.']],q:'친구가 응원해 준다면?',c:[['같이 금연 챌린지를 해 보자고 말할래.','q5'],['괜히 민망하니 숨길래.','a3']]},

let storyCurrent='',storyPath='';
function setLung(level){const box=document.querySelector('.lung-box');box.className='lung-box '+(level===0?'clean':'dark-'+level);$('lung').textContent=level===0?'🫁✨':'🫁';$('lungLabel').textContent=level===0?'깨끗하게 회복 중':level===1?'폐가 어두워지는 중':level===2?'폐가 많이 어두워짐':'폐가 검게 변함'}
function startGame(){storyCurrent='start';storyPath='';$('chatLog').innerHTML='';screen('game');setTimeout(drawStory,260)}
function drawStory(){const n=storyNodes[storyCurrent];$('stage').textContent=n.path;$('bar').style.width=(n.p/8*100)+'%';$('name').textContent=n.name;$('character').textContent=n.face;$('pathTag').textContent=n.path;setLung(n.lung);$('question').textContent='';$('choices').innerHTML='';$('feedback').textContent='';n.m.forEach((m,i)=>setTimeout(()=>addChat(m[2],m[0],m[1]),i*430));setTimeout(()=>{$('question').textContent=n.q;$('choices').innerHTML=n.c.map((c,i)=>`<button class="choice" onclick="chooseStory(${i})"><strong>${String.fromCharCode(65+i)}</strong>${c[0]}</button>`).join('')},n.m.length*430+130)}
function chooseStory(index){const n=storyNodes[storyCurrent],choice=n.c[index];document.querySelectorAll('.choice').forEach(b=>b.disabled=true);addChat(choice[0],'me','나');$('feedback').textContent='다음 대화가 이어집니다…';setTimeout(()=>{if(choice[1]==='good')finishStory(true);else if(choice[1]==='bad')finishStory(false);else{storyCurrent=choice[1];drawStory()}},820)}
function finishStory(good){$('resultTitle').textContent=good?'깨끗한 폐로 돌아온 결말':'중독이 이어진 결말';$('resultText').textContent=good?'유혹을 거절하고, 도움을 요청하며 금연을 이어 갔어요. 폐 이모티콘처럼 내 몸도 깨끗한 숨을 되찾아 갑니다.':'담배를 계속 선택하면서 중독은 더 깊어졌어요. 하지만 현실에서는 지금 이 순간에도 도움을 받아 금연으로 방향을 바꿀 수 있어요.';screen('ending')}
function restart(){screen('intro')}
</script></body></html>
